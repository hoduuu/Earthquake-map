<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대한민국 지진 지도 — 과거 전체 이력 (USGS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root {
    --bg: #f0f0f0;
    --panel-bg: #ffffff;
    --text: #222;
    --border: rgba(0, 0, 0, 0.15);
    --accent: #1f77b4;
    --shadow: rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --panel-bg: #262626;
    --text: #e8e8e8;
    --border: rgba(255, 255, 255, 0.18);
    --accent: #5aa9ff;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  html, body, #map { height: 100%; margin: 0; font-family: sans-serif; background: var(--bg); }
  .panel {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: var(--panel-bg); color: var(--text);
    padding: 10px 14px; border-radius: 6px;
    box-shadow: 0 1px 4px var(--shadow); font-size: 14px;
    max-width: 300px;
  }
  .panel label { display: inline-block; margin-right: 8px; }
  .panel input[type="number"] { width: 60px; }
  .panel button { margin-top: 6px; }
  .scope-row { margin-top: 6px; }

  .tabbar { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px 6px; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { border-bottom-color: var(--accent); font-weight: bold; }
  .tab-label { cursor: pointer; }

  .global-footer {
    margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px;
  }
  #countryPicker { margin-top: 6px; }
  .country-list {
    max-height: 140px; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px;
  }
  .country-list label { display: block; margin: 2px 0; font-weight: normal; }
  #status { margin-top: 6px; color: var(--text); opacity: 0.75; }
  .timeline-panel { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; }
  #timelineSlider { width: 100%; }
  .timeline-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .timeline-controls select { flex: 0 0 auto; }
  #timelineDate { font-size: 12px; opacity: 0.75; }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chart-panel { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; }
  .chart-title { font-size: 12px; opacity: 0.75; margin-bottom: 4px; }
  .chart { display: flex; align-items: flex-end; height: 60px; overflow-x: auto; gap: 1px; }
  .chart .bar { width: 4px; flex: 0 0 auto; background: var(--accent); min-height: 2px; }

  .legend {
    position: absolute; bottom: 20px; left: 10px; z-index: 1000;
    background: var(--panel-bg); color: var(--text);
    padding: 8px 12px; border-radius: 6px; box-shadow: 0 1px 4px var(--shadow);
    font-size: 13px;
  }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .square { width: 10px; height: 10px; display: inline-block; }
  .legend .line-swatch { width: 16px; height: 0; border-top: 2px solid var(--text); opacity: 0.5; display: inline-block; }

  /* 선택된 나라를 형광펜으로 칠한 듯 부드럽게 강조 */
  .country-highlight-glow {
    filter: drop-shadow(0 0 3px rgba(233, 30, 99, 0.9)) drop-shadow(0 0 8px rgba(233, 30, 99, 0.6));
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <div class="tabbar">
    <div class="tab-btn active" data-tab="quake">
      <input type="checkbox" id="quakeLayerToggle" checked>
      <span class="tab-label">지진</span>
    </div>
    <div class="tab-btn" data-tab="bases">
      <input type="checkbox" id="baseLayerToggle">
      <span class="tab-label">미군기지</span>
    </div>
  </div>

  <div class="tab-body" id="tab-quake">
    <label>시작연도 <input id="fromYear" type="number" value="1900" min="1800" max="2100"></label>
    <label>종료연도 <input id="toYear" type="number" value="2026" min="1800" max="2100"></label>
    <br>
    <label>최소 규모 <input id="minMag" type="number" value="2.5" step="0.1" min="0" max="9"></label>

    <div class="scope-row">
      <label><input type="radio" name="scope" value="kr" checked> 한국 인근</label>
      <label><input type="radio" name="scope" value="world"> 전 세계</label>
      <label><input type="radio" name="scope" value="countries"> 나라 선택 (복수 가능)</label>
    </div>
    <div id="countryPicker" style="display:none;">
      <div id="countryList" class="country-list"></div>
    </div>

    <button id="reload">다시 조회</button>
    <div id="status">불러오는 중...</div>

    <div class="timeline-panel">
      <div class="chart-title">타임라인 재생</div>
      <input id="timelineSlider" type="range" min="0" max="1000" value="1000">
      <div class="timeline-controls">
        <button id="playBtn">재생</button>
        <select id="speedSelect">
          <option value="1">1x</option>
          <option value="5" selected>5x</option>
          <option value="20">20x</option>
          <option value="50">50x</option>
        </select>
        <span id="timelineDate"></span>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">연도별 발생 건수</div>
      <div id="yearChart" class="chart"></div>
    </div>
  </div>

  <div class="tab-body" id="tab-bases" hidden>
    <p style="margin: 4px 0; font-size: 13px;">
      뉴스에 자주 나오는 주요 대형 해외 미군기지 위치입니다. 공개 정보 기반 참고용 좌표라 정밀하지 않습니다.
    </p>
    <div id="baseCount" style="font-size: 13px; opacity: 0.75;"></div>
  </div>

  <div class="global-footer">
    <label><input type="checkbox" id="borderToggle" checked> 국경선 표시</label>
    <label><input type="checkbox" id="darkToggle"> 다크 모드</label>
    <button id="copyLink">링크 복사</button>
  </div>
</div>

<div class="legend">
  <div class="row"><span class="dot" style="background:#1f77b4"></span> 규모 3 미만</div>
  <div class="row"><span class="dot" style="background:#ff7f0e"></span> 규모 3~5</div>
  <div class="row"><span class="dot" style="background:#d62728"></span> 규모 5 이상</div>
  <div class="row"><span class="square" style="background:#7b2ff7"></span> 미군기지</div>
  <div class="row"><span class="line-swatch"></span> 국경선</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  // USGS FDSN Event API — 키 불필요, CORS 지원.
  // 나라별 bounding box는 정확한 국경이 아니라 대략적인 사각형 근사치다 (데모용).
  // 나라 하나가 사각형 하나로는 잘 안 맞을 만큼 넓거나 삐뚤빼뚤하면(중국 등)
  // 사각형 여러 개를 배열로 나눠 겹치는 이웃 나라를 최대한 줄인다.
  const COUNTRIES = {
    '대한민국': [{ minlatitude: 33, maxlatitude: 39, minlongitude: 124, maxlongitude: 130 }],
    '북한': [{ minlatitude: 37.5, maxlatitude: 43, minlongitude: 124, maxlongitude: 130.7 }],
    '일본': [{ minlatitude: 24, maxlatitude: 46, minlongitude: 122, maxlongitude: 146 }],
    '중국': [
      { minlatitude: 18, maxlatitude: 39, minlongitude: 97, maxlongitude: 124.3 }, // 남·중부(한반도 이남)
      { minlatitude: 39, maxlatitude: 43, minlongitude: 97, maxlongitude: 125.3 }, // 베이징 이북~북한 접경
      { minlatitude: 43, maxlatitude: 53.5, minlongitude: 97, maxlongitude: 135 }, // 헤이룽장 등 최북단(북한 위쪽)
      { minlatitude: 28, maxlatitude: 49, minlongitude: 73, maxlongitude: 97 }, // 티베트·신장(서부)
    ],
    '대만': [{ minlatitude: 21.5, maxlatitude: 25.5, minlongitude: 119.5, maxlongitude: 122.5 }],
    '미국(본토)': [{ minlatitude: 24.5, maxlatitude: 49.5, minlongitude: -125, maxlongitude: -66.9 }],
    '인도네시아': [{ minlatitude: -11, maxlatitude: 6, minlongitude: 95, maxlongitude: 141 }],
    '필리핀': [{ minlatitude: 4.5, maxlatitude: 21.5, minlongitude: 116, maxlongitude: 127 }],
    '칠레': [{ minlatitude: -56, maxlatitude: -17.5, minlongitude: -76, maxlongitude: -66 }],
    '멕시코': [{ minlatitude: 14.5, maxlatitude: 32.7, minlongitude: -118.5, maxlongitude: -86.5 }],
    '터키': [{ minlatitude: 36, maxlatitude: 42.5, minlongitude: 26, maxlongitude: 45 }],
    '이탈리아': [{ minlatitude: 36.5, maxlatitude: 47.1, minlongitude: 6.6, maxlongitude: 18.6 }],
    '그리스': [{ minlatitude: 34.8, maxlatitude: 41.8, minlongitude: 19.3, maxlongitude: 29.7 }],
    '이란': [{ minlatitude: 25, maxlatitude: 39.8, minlongitude: 44, maxlongitude: 63.3 }],
    '인도': [{ minlatitude: 8, maxlatitude: 35.5, minlongitude: 68, maxlongitude: 97.5 }],
    '네팔': [{ minlatitude: 26.3, maxlatitude: 30.5, minlongitude: 80, maxlongitude: 88.3 }],
    '뉴질랜드': [{ minlatitude: -47.5, maxlatitude: -34, minlongitude: 166, maxlongitude: 178.6 }],
    '러시아': [
      { minlatitude: 50, maxlatitude: 82, minlongitude: 27, maxlongitude: 70 }, // 유럽 러시아 + 북극권
      { minlatitude: 41, maxlatitude: 46, minlongitude: 37, maxlongitude: 49 }, // 북캅카스(남부)
      { minlatitude: 52, maxlatitude: 82, minlongitude: 60, maxlongitude: 180 }, // 시베리아·극동
    ],
    '아이슬란드': [{ minlatitude: 63, maxlatitude: 66.6, minlongitude: -24.6, maxlongitude: -13 }],
    '페루': [{ minlatitude: -18.4, maxlatitude: 0, minlongitude: -81.4, maxlongitude: -68.6 }],
    '콜롬비아': [{ minlatitude: -4.3, maxlatitude: 13, minlongitude: -79.1, maxlongitude: -66.9 }],
    '에콰도르': [{ minlatitude: -5, maxlatitude: 1.5, minlongitude: -81, maxlongitude: -75 }],
    '파푸아뉴기니': [{ minlatitude: -11.7, maxlatitude: -1, minlongitude: 141, maxlongitude: 156.1 }],
    '통가': [{ minlatitude: -24, maxlatitude: -15, minlongitude: -176, maxlongitude: -173 }],
  };

  // 나라 이름 -> ISO 3166-1 alpha-3 코드. 실제 국경 도형(GeoJSON)을 찾을 때 쓴다.
  const ISO3 = {
    '대한민국': 'KOR', '북한': 'PRK', '일본': 'JPN', '중국': 'CHN', '대만': 'TWN',
    '미국(본토)': 'USA', '인도네시아': 'IDN', '필리핀': 'PHL', '칠레': 'CHL', '멕시코': 'MEX',
    '터키': 'TUR', '이탈리아': 'ITA', '그리스': 'GRC', '이란': 'IRN', '인도': 'IND',
    '네팔': 'NPL', '뉴질랜드': 'NZL', '러시아': 'RUS', '아이슬란드': 'ISL', '페루': 'PER',
    '콜롬비아': 'COL', '에콰도르': 'ECU', '파푸아뉴기니': 'PNG', '통가': 'TON',
  };

  const HIGHLIGHT_COLOR = '#e91e63'; // 선택된 나라 강조색 — 라이트/다크 모드 둘 다에서 잘 보이는 마젠타

  const LIGHT_TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  const DARK_TILE_URL = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
  const TILE_ATTRIBUTION =
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
    '&copy; <a href="https://carto.com/attributions">CARTO</a>';

  const WORLD_BOUNDS = [[-90, -180], [90, 180]];
  const map = L.map('map', {
    maxBounds: WORLD_BOUNDS,
    maxBoundsViscosity: 1.0,
    minZoom: 2,
  }).setView([36.5, 127.8], 7);

  const tileLayer = L.tileLayer(LIGHT_TILE_URL, {
    attribution: TILE_ATTRIBUTION,
    noWrap: true,
  }).addTo(map);

  let markerLayer = L.markerClusterGroup();
  map.addLayer(markerLayer);

  const countryOutlineLayer = L.layerGroup().addTo(map);

  // 공개적으로 알려진(위키피디아·언론 등) 주요 미군기지 위치. 정밀 좌표가 아닌 참고용.
  // 지진 레이어와 완전히 독립적으로 켜고 끌 수 있다. 나라별 구분 없이 위치만 표시.
  const US_BASES = [
    // 동아시아·태평양
    { name: '캠프 험프리스 (평택)', lat: 36.9646, lon: 127.0139 },
    { name: '오산 공군기지', lat: 37.0906, lon: 127.0294 },
    { name: '군산 공군기지', lat: 35.9039, lon: 126.6158 },
    { name: '캠프 케이시 (동두천)', lat: 37.9013, lon: 127.0764 },
    { name: '캠프 워커 (대구)', lat: 35.8514, lon: 128.6142 },
    { name: '캠프 캐럴 (칠곡)', lat: 35.9756, lon: 128.4039 },
    { name: '진해 해군기지', lat: 35.1499, lon: 128.6811 },
    { name: '요코타 공군기지 (일본)', lat: 35.7485, lon: 139.3486 },
    { name: '가데나 공군기지 (오키나와)', lat: 26.3556, lon: 127.7683 },
    { name: '요코스카 해군기지 (일본)', lat: 35.2928, lon: 139.6689 },
    { name: '캠프 자마 (일본)', lat: 35.5106, lon: 139.3944 },
    { name: '미사와 공군기지 (일본)', lat: 40.7032, lon: 141.3686 },
    { name: '앤더슨 공군기지 (괌)', lat: 13.5840, lon: 144.9298 },
    { name: '괌 해군기지', lat: 13.4443, lon: 144.6989 },
    { name: '파인갭 (호주)', lat: -23.7987, lon: 133.7373 },
    // 유럽
    { name: '람슈타인 공군기지 (독일)', lat: 49.4369, lon: 7.6003 },
    { name: '아비아노 공군기지 (이탈리아)', lat: 46.0319, lon: 12.5965 },
    { name: '시고넬라 해군기지 (이탈리아)', lat: 37.4013, lon: 14.9224 },
    { name: '나폴리 해군기지 (이탈리아, 6함대사령부)', lat: 40.8419, lon: 14.1875 },
    { name: 'RAF 레이큰히스 (영국)', lat: 52.4093, lon: 0.5610 },
    { name: 'RAF 밀든홀 (영국)', lat: 52.3617, lon: 0.4864 },
    { name: '로타 해군기지 (스페인)', lat: 36.6453, lon: -6.3494 },
    { name: '툴레 우주기지 (그린란드)', lat: 76.5312, lon: -68.7032 },
    // 중동·아프리카
    { name: '인지를릭 공군기지 (튀르키예)', lat: 37.0021, lon: 35.4259 },
    { name: '알 우데이드 공군기지 (카타르)', lat: 25.1174, lon: 51.3150 },
    { name: '바레인 해군기지 (5함대사령부)', lat: 26.2114, lon: 50.6090 },
    { name: '캠프 르모니에 (지부티)', lat: 11.5470, lon: 43.1590 },
    { name: '디에고가르시아 기지 (인도양)', lat: -7.3130, lon: 72.4111 },
    // 아메리카
    { name: '진주만-히컴 합동기지 (하와이)', lat: 21.3469, lon: -157.9397 },
    { name: '관타나모 해군기지 (쿠바)', lat: 19.9031, lon: -75.1005 },
    { name: '노퍽 해군기지 (미국, 세계 최대 해군기지)', lat: 36.9468, lon: -76.3287 },
    { name: '포트 리버티 (미국, 前 포트 브래그)', lat: 35.1391, lon: -79.0060 },
  ];

  const baseLayer = L.markerClusterGroup();
  for (const base of US_BASES) {
    const icon = L.divIcon({
      className: '',
      html: '<div style="width:12px;height:12px;background:#7b2ff7;border:1px solid rgba(0,0,0,0.4);transform:rotate(45deg);"></div>',
      iconSize: [12, 12],
    });
    L.marker([base.lat, base.lon], { icon }).bindPopup(`<b>${base.name}</b>`).addTo(baseLayer);
  }

  const statusEl = document.getElementById('status');
  const countryList = document.getElementById('countryList');
  const countryPicker = document.getElementById('countryPicker');
  const fromYearInput = document.getElementById('fromYear');
  const toYearInput = document.getElementById('toYear');
  const minMagInput = document.getElementById('minMag');
  const darkToggle = document.getElementById('darkToggle');
  const copyLinkBtn = document.getElementById('copyLink');
  const yearChartEl = document.getElementById('yearChart');
  const timelineSlider = document.getElementById('timelineSlider');
  const playBtn = document.getElementById('playBtn');
  const speedSelect = document.getElementById('speedSelect');
  const timelineDateEl = document.getElementById('timelineDate');
  const quakeLayerToggle = document.getElementById('quakeLayerToggle');
  const baseLayerToggle = document.getElementById('baseLayerToggle');

  quakeLayerToggle.addEventListener('change', (e) => {
    if (e.target.checked) map.addLayer(markerLayer);
    else map.removeLayer(markerLayer);
  });
  baseLayerToggle.addEventListener('change', (e) => {
    if (e.target.checked) map.addLayer(baseLayer);
    else map.removeLayer(baseLayer);
  });

  document.getElementById('baseCount').textContent = `총 ${US_BASES.length}곳`;

  // 탭 전환 — 레이어 표시 체크박스와는 독립적으로, 어느 탭의 설정을 보여줄지만 결정한다.
  for (const label of document.querySelectorAll('.tab-label')) {
    label.addEventListener('click', () => {
      const tabBtn = label.closest('.tab-btn');
      const tabName = tabBtn.dataset.tab;
      for (const b of document.querySelectorAll('.tab-btn')) b.classList.toggle('active', b === tabBtn);
      for (const body of document.querySelectorAll('.tab-body')) body.hidden = body.id !== `tab-${tabName}`;
    });
  }

  const borderToggle = document.getElementById('borderToggle');

  const countryCheckboxes = {};
  for (const name of Object.keys(COUNTRIES)) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = name;
    cb.addEventListener('change', loadQuakes);
    countryCheckboxes[name] = cb;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + name));
    countryList.appendChild(label);
  }

  function getSelectedCountries() {
    return Object.keys(countryCheckboxes).filter((name) => countryCheckboxes[name].checked);
  }

  function colorFor(mag) {
    if (mag >= 5) return '#d62728';
    if (mag >= 3) return '#ff7f0e';
    return '#1f77b4';
  }

  function quakeIcon(mag) {
    const color = colorFor(mag);
    const size = Math.max(8, mag * 5);
    return L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};opacity:0.75;border:1px solid rgba(0,0,0,0.35)"></div>`,
      iconSize: [size, size],
    });
  }

  function addMarkerForFeature(f) {
    const [lon, lat] = f.geometry.coordinates;
    const mag = f.properties.mag ?? 0;
    const place = f.properties.place ?? '';
    const time = new Date(f.properties.time).toLocaleString('ko-KR');
    L.marker([lat, lon], { icon: quakeIcon(mag) })
      .bindPopup(`<b>${place}</b><br>규모: ${mag}<br>${time}`)
      .addTo(markerLayer);
  }

  function currentScope() {
    return document.querySelector('input[name="scope"]:checked').value;
  }

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    tileLayer.setUrl(dark ? DARK_TILE_URL : LIGHT_TILE_URL);
    localStorage.setItem('eqmap-theme', dark ? 'dark' : 'light');
    if (allBordersLayer) allBordersLayer.setStyle({ color: borderBgColor(dark) });
  }

  function renderYearChart(features) {
    const counts = {};
    for (const f of features) {
      const year = new Date(f.properties.time).getFullYear();
      counts[year] = (counts[year] || 0) + 1;
    }
    const years = Object.keys(counts).map(Number).sort((a, b) => a - b);
    const max = Math.max(1, ...Object.values(counts));
    yearChartEl.innerHTML = '';
    for (const year of years) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(2, (counts[year] / max) * 56) + 'px';
      bar.title = `${year}: ${counts[year]}건`;
      yearChartEl.appendChild(bar);
    }
  }

  function updateUrl(state) {
    const params = new URLSearchParams();
    params.set('from', state.fromYear);
    params.set('to', state.toYear);
    params.set('mag', state.minMag);
    params.set('scope', state.scope);
    if (state.scope === 'countries') params.set('countries', state.countries.join(','));
    if (darkToggle.checked) params.set('dark', '1');
    history.replaceState(null, '', '?' + params.toString());
  }

  async function fetchBBox(bbox, fromYear, toYear, minMag) {
    const url = new URL('https://earthquake.usgs.gov/fdsnws/event/1/query');
    url.searchParams.set('format', 'geojson');
    url.searchParams.set('starttime', `${fromYear}-01-01`);
    url.searchParams.set('endtime', `${toYear}-12-31`);
    url.searchParams.set('minmagnitude', minMag);
    url.searchParams.set('orderby', 'time');
    url.searchParams.set('limit', '20000');
    if (bbox) {
      url.searchParams.set('minlatitude', bbox.minlatitude);
      url.searchParams.set('maxlatitude', bbox.maxlatitude);
      url.searchParams.set('minlongitude', bbox.minlongitude);
      url.searchParams.set('maxlongitude', bbox.maxlongitude);
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();
    return geojson.features;
  }

  async function fetchCountry(name, fromYear, toYear, minMag) {
    const boxes = COUNTRIES[name];
    const results = await Promise.all(boxes.map((bbox) => fetchBBox(bbox, fromYear, toYear, minMag)));
    const seen = new Set();
    const merged = [];
    for (const list of results) {
      for (const f of list) {
        if (!seen.has(f.id)) {
          seen.add(f.id);
          merged.push(f);
        }
      }
    }
    return merged;
  }

  // 실제 국경 도형(GeoJSON) — 나라 선택 시 테두리를 그리고, 정확한 조회 범위/필터링에 쓴다.
  // 정밀한 소스부터 시도하고, 실패하면 저해상도 소스로, 그것도 실패하면 위 COUNTRIES의
  // 사각형 근사치로 조용히 대체된다.
  const WORLD_BORDERS_URLS = [
    'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson', // 정밀
    'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json', // 저해상도 대체
  ];
  let worldBordersPromise = null;

  function loadWorldBorders() {
    if (!worldBordersPromise) {
      worldBordersPromise = (async () => {
        for (const url of WORLD_BORDERS_URLS) {
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const geojson = await res.json();
            const byIso3 = {};
            for (const f of geojson.features) {
              const code =
                f.id ||
                (f.properties &&
                  (f.properties.ISO_A3 || f.properties.iso_a3 || f.properties.ADM0_A3 || f.properties.ISO_A3_EH));
              if (code && code !== '-99') byIso3[code] = f;
            }
            return byIso3;
          } catch (err) {
            console.warn(`국경 도형 소스 실패, 다음 소스로 대체: ${url}`, err);
          }
        }
        console.warn('국경 도형을 모두 불러오지 못해 사각형 근사치로만 동작합니다.');
        return null;
      })();
    }
    return worldBordersPromise;
  }

  // 처음부터 전 세계 국경선을 은은하게 항상 그려두는 배경 레이어.
  let allBordersLayer = null;

  function borderBgColor(dark) {
    return dark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.35)';
  }

  loadWorldBorders().then((borders) => {
    if (!borders) return;
    allBordersLayer = L.geoJSON(Object.values(borders), {
      style: { color: borderBgColor(darkToggle.checked), weight: 1, fill: false },
      interactive: false,
    });
    if (borderToggle.checked) allBordersLayer.addTo(map);
  });

  borderToggle.addEventListener('change', (e) => {
    if (!allBordersLayer) return;
    if (e.target.checked) map.addLayer(allBordersLayer);
    else map.removeLayer(allBordersLayer);
  });

  function polygonRings(geometry) {
    return geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  }

  function pointInRing(lon, lat, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i];
      const [xj, yj] = ring[j];
      const intersect = yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi;
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function pointInGeometry(lon, lat, geometry) {
    for (const rings of polygonRings(geometry)) {
      if (!pointInRing(lon, lat, rings[0])) continue;
      let inHole = false;
      for (let h = 1; h < rings.length; h++) {
        if (pointInRing(lon, lat, rings[h])) {
          inHole = true;
          break;
        }
      }
      if (!inHole) return true;
    }
    return false;
  }

  function geometryBBox(geometry) {
    let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
    for (const rings of polygonRings(geometry)) {
      for (const [lon, lat] of rings[0]) {
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      }
    }
    return { minlongitude: minLon, maxlongitude: maxLon, minlatitude: minLat, maxlatitude: maxLat };
  }

  // 국경 도형이 있으면: 그 도형의 bbox로 조회하고, 실제 도형 안에 있는 점만 남긴다.
  // 날짜변경선을 가로지르는 나라(러시아 등)는 bbox 계산이 깨지므로 손으로 잡아둔
  // COUNTRIES 사각형들로 조회하되, 도형 안쪽 필터링은 건너뛴다.
  async function fetchCountryPrecise(name, feature, fromYear, toYear, minMag) {
    const geometry = feature.geometry;
    const bbox = geometryBBox(geometry);
    const spansAntimeridian = bbox.maxlongitude - bbox.minlongitude > 180;
    const boxesToQuery = spansAntimeridian ? COUNTRIES[name] : [bbox];
    const results = await Promise.all(boxesToQuery.map((b) => fetchBBox(b, fromYear, toYear, minMag)));
    const seen = new Set();
    const merged = [];
    for (const list of results) {
      for (const f of list) {
        if (seen.has(f.id)) continue;
        const [lon, lat] = f.geometry.coordinates;
        if (spansAntimeridian || pointInGeometry(lon, lat, geometry)) {
          seen.add(f.id);
          merged.push(f);
        }
      }
    }
    return merged;
  }

  let latestRequestId = 0;

  async function loadQuakes() {
    const requestId = ++latestRequestId;
    const fromYear = fromYearInput.value || '1900';
    const toYear = toYearInput.value || String(new Date().getFullYear());
    const minMag = minMagInput.value || '2.5';
    const scope = currentScope();
    statusEl.innerHTML = '<span class="spinner"></span>불러오는 중...';

    try {
      let features = [];
      let scopeLabel;
      let selectedCountries = [];
      let borders = null;

      if (scope === 'world') {
        features = await fetchBBox(null, fromYear, toYear, minMag);
        scopeLabel = '전 세계';
      } else if (scope === 'kr') {
        features = await fetchCountry('대한민국', fromYear, toYear, minMag);
        scopeLabel = '한국 인근';
      } else {
        selectedCountries = getSelectedCountries();
        if (selectedCountries.length === 0) {
          statusEl.textContent = '나라를 하나 이상 선택하세요.';
          markerLayer.clearLayers();
          countryOutlineLayer.clearLayers();
          yearChartEl.innerHTML = '';
          return;
        }
        borders = await loadWorldBorders();
        const results = await Promise.all(
          selectedCountries.map((name) => {
            const feature = borders && ISO3[name] ? borders[ISO3[name]] : null;
            return feature
              ? fetchCountryPrecise(name, feature, fromYear, toYear, minMag)
              : fetchCountry(name, fromYear, toYear, minMag);
          })
        );
        const seen = new Set();
        for (const list of results) {
          for (const f of list) {
            if (!seen.has(f.id)) {
              seen.add(f.id);
              features.push(f);
            }
          }
        }
        scopeLabel = selectedCountries.join(', ');
      }

      if (requestId !== latestRequestId) return; // 더 최신 요청이 이미 시작됨 — 이 응답은 버림

      countryOutlineLayer.clearLayers();
      if (scope === 'countries') {
        for (const name of selectedCountries) {
          const feature = borders && ISO3[name] ? borders[ISO3[name]] : null;
          if (feature) {
            L.geoJSON(feature, {
              className: 'country-highlight-glow',
              style: {
                color: HIGHLIGHT_COLOR,
                weight: 2,
                opacity: 0.95,
                fillColor: HIGHLIGHT_COLOR,
                fillOpacity: 0.16,
              },
            }).addTo(countryOutlineLayer);
          }
        }
      }

      markerLayer.clearLayers();
      for (const f of features) addMarkerForFeature(f);
      statusEl.textContent = `${features.length}건 (USGS, ${scopeLabel}, ${fromYear}~${toYear}년, 규모 ${minMag} 이상)`;
      renderYearChart(features);
      updateUrl({ fromYear, toYear, minMag, scope, countries: selectedCountries });

      stopPlaying();
      lastFeatures = features.slice().sort((a, b) => a.properties.time - b.properties.time);
      loadedFromYear = fromYear;
      loadedToYear = toYear;
      timelineSlider.value = 1000;
      timelineDateEl.textContent = lastFeatures.length ? `${toYear}-12-31 (전체)` : '';
    } catch (err) {
      if (requestId === latestRequestId) statusEl.textContent = '조회 실패: ' + err.message;
    }
  }

  // 타임라인 재생 — 마지막으로 불러온 features를 시간순으로 하나씩 누적 표시한다.
  let lastFeatures = [];
  let loadedFromYear = fromYearInput.value;
  let loadedToYear = toYearInput.value;
  let playing = false;
  let playTimer = null;
  const TIMELINE_BASE_DURATION_MS = 15000; // 1x 속도로 전체 재생하는 데 걸리는 기준 시간

  function applyTimelineProgress(fraction) {
    if (!lastFeatures.length) return;
    const startMs = Date.parse(`${loadedFromYear}-01-01`);
    const endMs = Date.parse(`${loadedToYear}-12-31`);
    const cutoff = startMs + fraction * (endMs - startMs);
    markerLayer.clearLayers();
    for (const f of lastFeatures) {
      if (f.properties.time <= cutoff) addMarkerForFeature(f);
    }
    const label = fraction >= 1 ? `${loadedToYear}-12-31 (전체)` : new Date(cutoff).toLocaleDateString('ko-KR');
    timelineDateEl.textContent = label;
  }

  function stopPlaying() {
    playing = false;
    playBtn.textContent = '재생';
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
    }
  }

  function startPlaying() {
    if (!lastFeatures.length) return;
    if (Number(timelineSlider.value) >= 1000) timelineSlider.value = 0;
    playing = true;
    playBtn.textContent = '일시정지';
    const tickMs = 100;
    playTimer = setInterval(() => {
      const speed = Number(speedSelect.value);
      const stepFraction = (tickMs / TIMELINE_BASE_DURATION_MS) * speed;
      const fraction = Math.min(1, Number(timelineSlider.value) / 1000 + stepFraction);
      timelineSlider.value = Math.round(fraction * 1000);
      applyTimelineProgress(fraction);
      if (fraction >= 1) stopPlaying();
    }, tickMs);
  }

  playBtn.addEventListener('click', () => (playing ? stopPlaying() : startPlaying()));
  timelineSlider.addEventListener('input', () => {
    stopPlaying();
    applyTimelineProgress(Number(timelineSlider.value) / 1000);
  });

  document.getElementById('reload').addEventListener('click', loadQuakes);

  copyLinkBtn.addEventListener('click', () => {
    navigator.clipboard
      .writeText(location.href)
      .then(() => {
        const original = copyLinkBtn.textContent;
        copyLinkBtn.textContent = '복사됨!';
        setTimeout(() => (copyLinkBtn.textContent = original), 1500);
      })
      .catch(() => alert('클립보드 복사에 실패했습니다. 주소창의 URL을 직접 복사하세요.'));
  });

  darkToggle.addEventListener('change', (e) => applyTheme(e.target.checked));

  for (const radio of document.querySelectorAll('input[name="scope"]')) {
    radio.addEventListener('change', (e) => {
      const scope = e.target.value;
      countryPicker.style.display = scope === 'countries' ? 'block' : 'none';

      // 전 세계 + 오래된 기간 + 낮은 규모를 한꺼번에 조회하면 응답이 너무 커질 수 있어
      // 기본 최소 규모를 올려준다. 사용자가 직접 낮추는 건 자유.
      if (scope === 'world' && Number(minMagInput.value) < 4.5) {
        minMagInput.value = '4.5';
      }

      if (scope === 'world') {
        map.setView([20, 10], 2);
      } else if (scope === 'kr') {
        map.setView([36.5, 127.8], 7);
      }

      if (scope !== 'countries') loadQuakes();
    });
  }

  // URL 쿼리 파라미터로 초기 상태 복원 (링크 공유용)
  (function restoreFromUrl() {
    const params = new URLSearchParams(location.search);
    if (params.has('from')) fromYearInput.value = params.get('from');
    if (params.has('to')) toYearInput.value = params.get('to');
    if (params.has('mag')) minMagInput.value = params.get('mag');

    const scope = params.get('scope');
    if (scope) {
      const radio = document.querySelector(`input[name="scope"][value="${scope}"]`);
      if (radio) radio.checked = true;
    }
    if (currentScope() === 'countries') {
      countryPicker.style.display = 'block';
      const wanted = new Set((params.get('countries') || '').split(',').filter(Boolean));
      for (const name of wanted) {
        if (countryCheckboxes[name]) countryCheckboxes[name].checked = true;
      }
    }

    const savedTheme = localStorage.getItem('eqmap-theme');
    const wantDark = params.has('dark') ? params.get('dark') === '1' : savedTheme === 'dark';
    if (wantDark) {
      darkToggle.checked = true;
      applyTheme(true);
    }
  })();

  loadQuakes();
</script>
</body>
</html>
